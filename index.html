<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent IA Pro</title>
<style>
body { font-family: Arial; background:#0d1117; color:white; margin:0 }
#loading { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; flex-direction:column }
#app { display:none }
button { padding:10px; border:none; border-radius:8px; background:#7c6af7; color:white; cursor:pointer }
textarea { width:100%; padding:10px; border-radius:8px; margin-top:10px }
</style>
</head>

<body onload="forceStart()">

<div id="loading">
  <p>Chargement de l'Agent IA...</p>
</div>

<div id="app">
  <h2>🤖 Agent IA Pro</h2>
  <div id="messages"></div>
  <textarea id="msg"></textarea>
  <button onclick="send()">Envoyer</button>
</div>

<script>
var cfg = { provider:"demo", apikey:"" };
var messages = [];

function init(){
  console.log("INIT OK");
}

function forceStart(){
  console.log("FORCE START");

  try { init(); } catch(e){ console.error(e); }

  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="block";
  },500);
}

function addMsg(text){
  var div = document.createElement("div");
  div.innerHTML = text;
  document.getElementById("messages").appendChild(div);
}

async function send(){
  var input = document.getElementById("msg");
  var txt = input.value;
  if(!txt) return;

  addMsg("👤 "+txt);
  input.value="";

  addMsg("🤖 ...");

  let reply = "Réponse démo";

  if(cfg.apikey){
    try{
      let r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+cfg.apikey,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{parts:[{text:txt}]}]
        })
      });
      let d = await r.json();
      reply = d.candidates?.[0]?.content?.parts?.[0]?.text || "Erreur IA";
    }catch(e){
      reply = "Erreur connexion IA";
    }
  }

  addMsg("🤖 "+reply);
}
</script>

</body>
</html>
